version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pos_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: pos-backend
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pos_db
      DB_USERNAME: root
      DB_PASSWORD: root
      MAIL_USERNAME: your@gmail.com
      MAIL_PASSWORD: app_password
      FRONTEND_RESET_URL: http://localhost:5173/auth/reset-password?token=

volumes:
  mysql_data:
